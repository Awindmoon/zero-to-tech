<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的个人博客</title>
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
  <div class="bg-layer" id="bgLayer"></div>
  <div class="overlay"></div>

  <main class="container">
    <article class="profile-card">
      <header class="card-header">
        <div class="avatar-wrap">
          <img id="avatarImg" class="avatar" src="" alt="头像">
          <label class="avatar-upload" id="avatarUploadLabel" hidden>
            <input type="file" id="avatarInput" accept="image/*" hidden>
            <span>更换头像</span>
          </label>
        </div>
        <div class="header-info">
          <h1 id="displayName">未设置姓名</h1>
          <p class="subtitle" id="displaySubtitle">欢迎来到我的个人空间</p>
        </div>
        <button type="button" class="btn btn-edit" id="editBtn">编辑资料</button>
      </header>

      <section class="info-section" id="viewMode">
        <dl class="info-list">
          <div class="info-item">
            <dt>性别</dt>
            <dd id="viewGender">—</dd>
          </div>
          <div class="info-item">
            <dt>年龄</dt>
            <dd id="viewAge">—</dd>
          </div>
          <div class="info-item">
            <dt>星座</dt>
            <dd id="viewZodiac">—</dd>
          </div>
          <div class="info-item">
            <dt>QQ</dt>
            <dd id="viewQQ">—</dd>
          </div>
          <div class="info-item">
            <dt>联系方式</dt>
            <dd id="viewContact">—</dd>
          </div>
          <div class="info-item">
            <dt>邮箱</dt>
            <dd id="viewEmail">—</dd>
          </div>
        </dl>
      </section>

      <section class="edit-section" id="editMode" hidden>
        <form id="profileForm" class="edit-form">
          <div class="form-group">
            <label for="inputName">姓名</label>
            <input type="text" id="inputName" placeholder="请输入姓名" maxlength="20">
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="inputGender">性别</label>
              <select id="inputGender">
                <option value="">请选择</option>
                <option value="男">男</option>
                <option value="女">女</option>
                <option value="其他">其他</option>
              </select>
            </div>
            <div class="form-group">
              <label for="inputAge">年龄</label>
              <input type="number" id="inputAge" min="1" max="120" placeholder="年龄">
            </div>
            <div class="form-group">
              <label for="inputZodiac">星座</label>
              <select id="inputZodiac">
                <option value="">请选择</option>
                <option value="白羊座">白羊座</option>
                <option value="金牛座">金牛座</option>
                <option value="双子座">双子座</option>
                <option value="巨蟹座">巨蟹座</option>
                <option value="狮子座">狮子座</option>
                <option value="处女座">处女座</option>
                <option value="天秤座">天秤座</option>
                <option value="天蝎座">天蝎座</option>
                <option value="射手座">射手座</option>
                <option value="摩羯座">摩羯座</option>
                <option value="水瓶座">水瓶座</option>
                <option value="双鱼座">双鱼座</option>
              </select>
            </div>
          </div>
          <div class="form-group">
            <label for="inputQQ">QQ 号</label>
            <input type="text" id="inputQQ" placeholder="请输入 QQ 号" maxlength="15">
          </div>
          <div class="form-group">
            <label for="inputContact">联系方式</label>
            <input type="text" id="inputContact" placeholder="手机 / 微信等" maxlength="50">
          </div>
          <div class="form-group">
            <label for="inputEmail">邮箱</label>
            <input type="email" id="inputEmail" placeholder="example@email.com" maxlength="60">
          </div>
          <div class="form-group">
            <label for="bgInput">背景图片</label>
            <input type="file" id="bgInput" accept="image/*">
            <button type="button" class="btn-link" id="resetBgBtn">恢复默认背景</button>
          </div>
          <div class="form-actions">
            <button type="button" class="btn btn-cancel" id="cancelBtn">取消</button>
            <button type="submit" class="btn btn-save">保存</button>
          </div>
        </form>
      </section>
    </article>

    <footer class="page-footer">
      <p>记录生活，分享思考 ✨</p>
    </footer>
  </main>

  <script src="./script.js"></script>
  </body>
</html>
